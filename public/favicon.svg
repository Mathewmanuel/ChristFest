<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald Radial Background -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0c2e22"/>
      <stop offset="70%" stop-color="#04150e"/>
      <stop offset="100%" stop-color="#020a07"/>
    </radialGradient>
    
    <!-- Imperial Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="30%" stop-color="#f5d77f"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Glowing Aura Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  
  <!-- Outer Ornate Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.75" />
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Center Golden Radial Halo -->
  <circle cx="256" cy="220" r="160" fill="url(#glowGrad)"/>

  <!-- Roman Laurel Wreath Base -->
  <g filter="url(#shadow)" stroke="url(#goldGrad)" stroke-width="3" fill="none">
    <!-- Left Wreath Branch -->
    <path d="M 170 340 C 130 300, 120 220, 160 150 C 175 125, 200 100, 230 85" stroke-linecap="round"/>
    <!-- Right Wreath Branch -->
    <path d="M 342 340 C 382 300, 392 220, 352 150 C 337 125, 312 100, 282 85" stroke-linecap="round"/>
  </g>

  <!-- Laurel Leaves (Left) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 155 155 C 135 150, 130 135, 145 130 C 160 135, 162 148, 155 155 Z"/>
    <path d="M 140 190 C 120 188, 112 172, 128 165 C 142 172, 146 182, 140 190 Z"/>
    <path d="M 134 230 C 114 230, 108 215, 122 206 C 138 212, 140 222, 134 230 Z"/>
    <path d="M 140 270 C 122 274, 114 260, 126 250 C 142 254, 145 264, 140 270 Z"/>
    <path d="M 158 308 C 140 316, 130 302, 142 290 C 156 294, 162 302, 158 308 Z"/>
    <path d="M 188 338 C 172 348, 160 336, 170 322 C 184 324, 190 332, 188 338 Z"/>
  </g>

  <!-- Laurel Leaves (Right) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M 357 155 C 377 150, 382 135, 367 130 C 352 135, 350 148, 357 155 Z"/>
    <path d="M 372 190 C 392 188, 400 172, 384 165 C 370 172, 366 182, 372 190 Z"/>
    <path d="M 378 230 C 398 230, 404 215, 390 206 C 374 212, 372 222, 378 230 Z"/>
    <path d="M 372 270 C 390 274, 398 260, 386 250 C 370 254, 367 264, 372 270 Z"/>
    <path d="M 354 308 C 372 316, 382 302, 370 290 C 356 294, 350 302, 354 308 Z"/>
    <path d="M 324 338 C 340 348, 352 336, 342 322 C 328 324, 322 332, 324 338 Z"/>
  </g>

  <!-- Central Majestic Latin Cross with Holy Spirit Flames / Crown Motif -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Beam -->
    <rect x="240" y="105" width="32" height="200" rx="4" fill="url(#goldGrad)" />
    <!-- Horizontal Cross Beam -->
    <rect x="180" y="150" width="152" height="32" rx="4" fill="url(#goldGrad)" />
    
    <!-- Cross Inner Filigree / Highlights -->
    <line x1="256" y1="112" x2="256" y2="298" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="188" y1="166" x2="324" y2="166" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Cross Diamond Finials -->
    <polygon points="256,92 266,105 256,112 246,105" fill="url(#goldGrad)"/>
    <polygon points="167,166 180,156 187,166 180,176" fill="url(#goldGrad)"/>
    <polygon points="345,166 332,156 325,166 332,176" fill="url(#goldGrad)"/>

    <!-- Holy Flame / Radiance at Center of Cross -->
    <circle cx="256" cy="166" r="14" fill="#ffffff" filter="url(#glow)" opacity="0.9"/>
    <circle cx="256" cy="166" r="8" fill="url(#goldGrad)"/>
  </g>

  <!-- Alpha & Omega Symbols -->
  <!-- Alpha (Left) -->
  <text x="184" y="240" font-family="'Cinzel', serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" opacity="0.85">Α</text>
  <!-- Omega (Right) -->
  <text x="328" y="240" font-family="'Cinzel', serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" opacity="0.85">Ω</text>

  <!-- Ribbon Banner for KLESIS Title -->
  <g filter="url(#shadow)">
    <!-- Main Banner Body -->
    <path d="M 90 380 L 422 380 L 400 426 L 112 426 Z" fill="#061f14" stroke="url(#goldGrad)" stroke-width="2.5"/>
    
    <!-- Banner Corner Folds -->
    <path d="M 90 380 L 68 402 L 90 426 L 112 426 Z" fill="#03100a" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M 422 380 L 444 402 L 422 426 L 400 426 Z" fill="#03100a" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>

  <!-- Typography: KLESIS -->
  <text x="256" y="414" font-family="'Cinzel Decorative', 'Cinzel', serif" font-size="34" font-weight="900" letter-spacing="6" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">
    KLESIS
  </text>

  <!-- Subtitle: 35TH CHRISTFEST 2026 -->
  <text x="256" y="454" font-family="'Cinzel', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#f5d77f" text-anchor="middle" opacity="0.95">
    35TH CHRISTFEST 2026
  </text>
</svg>
